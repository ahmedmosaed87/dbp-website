<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الصفحة غير موجودة · Page not found · Deep Business Partners</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* A page that was moved or mistyped: say so plainly in both languages and offer the way back. Absolute paths, because it can be served from any address. */
  :root{--ink:#0b1220;--ink-2:#4a5468;--blue:#2c55f5;--ground:#f6f8fc}
  html,body{height:100%}
  body{margin:0;display:grid;place-items:center;background:radial-gradient(900px 500px at 50% -10%,rgba(79,214,222,.16),transparent 60%),var(--ground);color:var(--ink);font-family:'IBM Plex Sans','IBM Plex Sans Arabic',system-ui,sans-serif;padding:24px 16px;box-sizing:border-box;text-align:center}
  main{max-width:620px}
  img{height:72px;width:auto;margin-bottom:28px}
  .code{font-size:15px;font-weight:600;letter-spacing:.14em;color:var(--blue);margin:0 0 6px}
  h1{font-size:clamp(28px,5vw,40px);font-weight:600;margin:0 0 8px;line-height:1.25}
  p{font-size:17px;line-height:1.7;color:var(--ink-2);margin:0 0 6px}
  .en{direction:ltr;margin-top:26px;padding-top:22px;border-top:1px solid #dfe6f2}
  .go{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
  .go a{font-size:15px;font-weight:600;text-decoration:none;padding:12px 20px;border-radius:999px;background:var(--blue);color:#fff}
  .go a.ghost{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1px #d6e0ef}
  .go a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
</style>
</head>
<body>
<main>
  <img src="/assets/dbp-logo.png" alt="Deep Business Partners" width="196" height="72">
  <p class="code">404</p>
  <h1>لم نجد هذه الصفحة</h1>
  <p>ربما نُقلت أو تغيّر عنوانها. ابدأ من الصفحة الرئيسية، أو تحدّث معنا مباشرة.</p>
  <div class="en">
    <h1>We couldn’t find this page</h1>
    <p>It may have moved or its address changed. Start from the home page, or talk to us directly.</p>
  </div>
  <div class="go">
    <a href="/">الصفحة الرئيسية · Home</a>
    <a class="ghost" href="/pricing.html">الأسعار · Pricing</a>
    <a class="ghost" href="mailto:ahmed.eissa@deep-bp.com">تواصل معنا · Contact us</a>
  </div>
</main>
</body>
</html>
