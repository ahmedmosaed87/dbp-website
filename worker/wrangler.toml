# WHAT THIS DOES: Tells Cloudflare how to run the early-access receiver: its name, its code and its private database.
# The database lives in Cloudflare D1 (created 7 Nov 2026, region Western Europe).
name = "dbp-early-access"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "dbp-early-access"
database_id = "33bb5218-3522-4901-affb-9542d993f1cb"
